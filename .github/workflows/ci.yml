name: ci

# Every push and pull request: the sources fetched and checked against the locks, the gates on every
# file and every commit diff, lint and strict types, the whole suite with coverage against a real
# Postgres, the trainers included on CPU with a tiny model, the claim gate, the registration check,
# the grading of every exported completion, the container answering from a separate process, and the
# site.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  UV_SYSTEM_CERTS: "1"

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goodhart
          POSTGRES_PASSWORD: goodhart
          POSTGRES_DB: goodhart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goodhart" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://goodhart:goodhart@localhost:5432/goodhart
      GOODHART_REQUIRE: postgres,warehouses,torch,floor,ifeval
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install, with readback's floor at its pinned commit and CPU PyTorch for the trainer tests
        run: |
          uv sync --frozen --extra floor --extra ifeval
          uv pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.6"
          uv pip install "transformers==5.22.1" "trl==1.17.1" "peft==0.21.2" "datasets==5.1.0" "accelerate==1.15.0"
      - name: The sources, by digest
        run: uv run python scripts/fetch_sources.py
      - name: Google's IFEval checker and prompts, by digest
        run: uv run --no-sync goodhart ifeval --fetch
      - name: The completion exports, by digest
        if: hashFiles('data/results.lock.json') != ''
        run: uv run python scripts/fetch_results.py
      - name: Gates (every file, every commit diff)
        run: make gates
      - name: Lint and types
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
          uv run --no-sync mypy
      - name: Tests, the trainers included, with coverage over every module
        run: uv run --no-sync pytest --cov --cov-report=term --cov-fail-under=80
      - name: Every promoted GPU run, byte for byte as the kernel reported it
        if: hashFiles('results/runs/*/provenance.json') != ''
        run: uv run --no-sync python scripts/promote_results.py --check
      - name: The questions, twins and mutants rebuild to the committed digests
        if: hashFiles('data/questions/manifest.json') != ''
        run: uv run --no-sync goodhart rebuild-check
      - name: Every exported completion graded again in the repository
        if: hashFiles('results/grades/index.json') != ''
        run: uv run --no-sync goodhart grade --check
      - name: The claim gate
        if: hashFiles('results/manifest.json') != ''
        run: uv run --no-sync python scripts/check_published_numbers.py
      - name: The skills
        if: hashFiles('.claude/skills/*/SKILL.md') != ''
        run: uv run --no-sync python scripts/check_skills.py
      - name: The notebooks
        if: hashFiles('notebooks/*.ipynb') != ''
        run: uv run --no-sync pytest --nbmake notebooks -q

  container:
    # The Vercel image, built and run here, grades one query; a separate process then reads the grade
    # back from the database and through the API.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: goodhart
          POSTGRES_PASSWORD: goodhart
          POSTGRES_DB: goodhart
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U goodhart" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - name: Build the image
        run: docker build -f Dockerfile.vercel -t goodhart .
      - name: Start it against the CI database
        run: |
          docker run -d --name gh --network host -e PORT=8080 -e GOODHART_SALT=ci \
            -e DATABASE_URL=postgresql://goodhart:goodhart@localhost:5432/goodhart goodhart
          for _ in $(seq 1 90); do curl -fsS http://127.0.0.1:8080/health >/dev/null && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/health | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['database'] == 'ok' and d['stage'] == 'grading', d; print(d['kept_twins'], d['questions'])"
      - name: Grade one query and read it back from a separate process
        run: |
          pip install -q "httpx>=0.28" "psycopg[binary]>=3.2"
          python3 scripts/check_persistence.py --base http://127.0.0.1:8080 \
            --database postgresql://goodhart:goodhart@localhost:5432/goodhart
      - name: The container log, when something failed
        if: failure()
        run: docker logs gh | tail -100
