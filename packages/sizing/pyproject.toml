[project]
name = "goodhart-sizing"
version = "0.1.0"
description = "The workload sizing sheet from the run ledger"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "goodhart-core",
  "pyyaml>=6.0",
]

[tool.uv.sources]
goodhart-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goodhart_sizing"]
