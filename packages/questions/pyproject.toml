[project]
name = "goodhart-questions"
version = "0.1.0"
description = "The question generator over the readback catalog: families, templates, splits, held-out sets"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "goodhart-core",
  "numpy>=2.0",
]

[tool.uv.sources]
goodhart-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goodhart_questions"]
