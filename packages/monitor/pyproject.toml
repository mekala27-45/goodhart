[project]
name = "goodhart-monitor"
version = "0.1.0"
description = "Hack detectors and the training monitors with their registered thresholds"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "goodhart-core",
  "goodhart-rewards",
]

[tool.uv.sources]
goodhart-core = { workspace = true }
goodhart-rewards = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goodhart_monitor"]
