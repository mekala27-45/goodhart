[project]
name = "goodhart-render"
version = "0.1.0"
description = "The claim gate, written as a document renderer"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "goodhart-core",
  "jinja2>=3.1",
  "markdown-it-py>=3.0",
]

[tool.uv.sources]
goodhart-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goodhart_render"]
