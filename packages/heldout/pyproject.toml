[project]
name = "goodhart-heldout"
version = "0.1.0"
description = "Checks the reward never sees: twin warehouses, their distillation and the mutation score"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "goodhart-core",
  "goodhart-rewards",
  "goodhart-questions",
  "numpy>=2.0",
  "pyarrow>=18",
]

[tool.uv.sources]
goodhart-core = { workspace = true }
goodhart-rewards = { workspace = true }
goodhart-questions = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goodhart_heldout"]
