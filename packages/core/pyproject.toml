[project]
name = "goodhart-core"
version = "0.1.0"
description = "Shared contracts, digests, the statement, formats, the manifest and the locked warehouse connection"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.10",
  "pyyaml>=6.0",
  "duckdb==2.0.0",
  "sqlglot==30.27.0",
  "structlog>=25.1",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goodhart_core"]
