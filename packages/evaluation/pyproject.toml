[project]
name = "goodhart-evaluation"
version = "0.1.0"
description = "Grading in the repository: twin confirmed accuracy, pass at k, intervals, Benjamini-Hochberg, interior tests"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "goodhart-core",
  "goodhart-rewards",
  "goodhart-heldout",
  "goodhart-questions",
  "goodhart-monitor",
  "goodhart-render",
  "goodhart-sizing",
  "goodhart-judge",
  "numpy>=2.0",
  "scipy>=1.14",
  "pyyaml>=6.0",
  "pyarrow>=18",
  "typer>=0.15",
  "httpx>=0.28",
  # The small local embedding model behind the near duplicate check of the contamination report:
  # spaCy's medium English pipeline (MIT), 300 dimensional static vectors, fetched by URL and locked.
  "spacy>=3.8,<3.9",
  "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
]

[project.scripts]
goodhart = "goodhart_evaluation.cli:app"

[tool.uv.sources]
goodhart-core = { workspace = true }
goodhart-rewards = { workspace = true }
goodhart-heldout = { workspace = true }
goodhart-questions = { workspace = true }
goodhart-monitor = { workspace = true }
goodhart-render = { workspace = true }
goodhart-sizing = { workspace = true }
goodhart-judge = { workspace = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/goodhart_evaluation"]
