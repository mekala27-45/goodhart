# Training and sampling defaults, read by every kernel stage. A request may override a value in its
# hyperparameters; changing a default needs a dated DECISIONS.md entry. The TRL defaults these rely on
# were read from the installed trl 1.17.1 on 31 October 2026 and are listed in DECISIONS.md.
lora:
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

sft:
  set: clean
  epochs: 2
  learning_rate: 2.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  # Two sequences per micro batch, sixteen per optimizer step as before. At eight the full
  # vocabulary logits of one micro batch (eight by about 1,150 tokens by 151,936, in float32) were
  # 5.6 GB, and the second probe's LoRA step ran out of memory on every candidate.
  batch_size: 2
  gradient_accumulation: 8
  gradient_checkpointing: true
  # The longest prompt plus answer in the clean set is under 1,400 tokens for every candidate's
  # tokenizer; the probe prints the measured distribution.
  max_length: 1536
  logging_steps: 5
  save_steps: 25
  max_new_tokens: 256

dpo:
  beta: 0.1
  epochs: 1
  learning_rate: 5.0e-6
  scheduler: cosine
  # One pair per micro batch (a chosen and a rejected sequence), sixteen pairs per optimizer step as
  # before, for the reason the SFT micro batch is two.
  batch_size: 1
  gradient_accumulation: 16
  gradient_checkpointing: true
  max_length: 1536
  logging_steps: 5
  save_steps: 25
  max_new_tokens: 256

grpo:
  learning_rate: 2.0e-5
  scheduler: constant_with_warmup
  warmup_ratio: 0.0
  # Eight prompts per optimizer step, eight generations per prompt: 64 completions per step,
  # generated two prompts (16 completions) at a time so the KV cache of a dense 0.6B model at the
  # prompt lengths here (about 1,500 tokens) fits a T4 beside the training state. The probe ran out
  # of memory at 64 sequences per generate call.
  num_generations: 8
  batch_size: 8
  gradient_accumulation: 8
  generation_batch_size: 16
  gradient_checkpointing: true
  temperature: 0.8
  # The longest gold SQL is under 160 tokens; a fence and room to spare make 256.
  max_completion_length: 256
  beta: 0.0
  loss_type: dr_grpo
  scale_rewards: group
  max_steps: 200
  save_steps: 25
  generation_backend: transformers
  # With vLLM, rollouts come from a server on the second card (TRL's server mode) and training runs
  # on the first; colocate, at this share of one card, is the fallback for a single card.
  vllm_mode: server
  vllm_server_memory: 0.85
  vllm_gpu_memory_utilization: 0.3
  max_model_len: 2048
  chat_template_kwargs: {enable_thinking: false}
  prompt_set: train
  try_vllm: true
  vllm_version: "0.32.0"

select:
  k: 8
  temperature: 0.8
  max_new_tokens: 256
  generation_backend: transformers
  generation_batch: 64
  max_model_len: 2048
  vllm_memory: 0.85

sample:
  n: 16
  temperature: 0.8
  max_new_tokens: 256
  generation_backend: transformers
  generation_batch: 64
  max_model_len: 2048
  vllm_memory: 0.85
  sampled_sets: [readback_test, test, template_test]
  greedy_sets: []

pairs:
  n: 8
  temperature: 0.8
  max_new_tokens: 256
  generation_backend: transformers
  generation_batch: 64
  max_model_len: 2048
  vllm_memory: 0.85

judge:
  max_new_tokens: 16
  generation_backend: transformers
  generation_batch: 32
  max_model_len: 4096
  vllm_memory: 0.85
